name: 自检

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

# 只读仓库内容即可，不给 token 多余权限
permissions:
  contents: read

# 同一分支连续推送时取消旧的一次，省 runner 时间
concurrency:
  group: selftest-${{ github.ref }}
  cancel-in-progress: true

jobs:
  selftest:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      # 第三方 action 全部 pin 到 commit SHA（行尾注释是版本号）；
      # 升级由 .github/dependabot.yml 自动开 PR 完成。
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262   # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020  # v4
        with:
          node-version: '20'

      # 元数据校验 + 脚本内置的 73 项断言，无第三方依赖
      - name: 内置自检
        run: node tools/selftest.mjs

      # GitHub runner 自带 Chrome；--require-browser 让「找不到浏览器」直接失败，
      # 避免面板冒烟被静默跳过、CI 假绿。
      - name: 面板冒烟测试
        run: node tools/panel-smoke.mjs --require-browser
