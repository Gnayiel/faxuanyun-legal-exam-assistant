name: 发版

# 推送 vX.Y.Z tag 时自动发布 Release：verify job 只读跑 tag/版本/CHANGELOG 门禁与全套自检，
# release job 才拿最小写权限，建 Release、上传 .user.js/.sha256 与构建来源证明。
# `v*` tag 受 protect-release-tags 规则集保护（不能删除 / 改指向）：tag 打错请改用新版本号；
# 确实要重打 tag 时先临时停用该 ruleset。未开启 immutable releases 时脚本用 --clobber 覆盖附件，
# 验证失败修好后可直接重跑本 workflow；开启 immutable releases 后不能覆盖已发布资产，只能发新 patch。
on:
  push:
    tags: ['v*']

# verify 只读；release 在 job 内按需声明 contents: write + attestations/id-token。
permissions:
  contents: read

concurrency:
  # 全局串行：两个 tag 同时发版会竞争 latest Release / 校验步骤，宁可排队也不并发。
  group: release
  cancel-in-progress: false

jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      contents: read
    steps:
      # 第三方 action 全部 pin 到 commit SHA，升级由 Dependabot 开 PR。
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1   # v7.0.1
        with:
          # 版本单调 / 历史比较要读完整 tag 历史，浅克隆下会退化。
          fetch-depth: 0
          # verify 只读：不把 GITHUB_TOKEN 留在 .git/config 里
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1  # v7.1.0
        with:
          node-version: '22'
      # 发版门禁 1：推送的 tag 必须正好等于脚本 // @version，且 CHANGELOG 有本版非空章节。
      # 不一致直接红，避免「v2.0.5 的 Release 里挂 2.0.4 的脚本」或空说明发布。
      - name: 校验 tag 与脚本版本 / CHANGELOG 章节
        env:
          TAG: ${{ github.ref_name }}
        run: node tools/release.mjs --check-ci "$TAG"

      # 发版门禁 2：与 selftest.yml、本地 `npm run ci` 完全同一条命令——语法、元数据、
      # 内置断言、数据/文档数字漂移、工作流配置、题库合并冒烟与两种浏览器冒烟一次跑完。
      # 任一失败即中止，release job 不会启动（不再手抄步骤，避免本地/CI 清单漂移）。
      - name: 发版前自检（统一门禁）
        run: npm run ci

  release:
    needs: verify
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: write
      id-token: write
      attestations: write
    steps:
      # 发布 job 只做校验和、Release 与来源证明，不再跑 npm；浅克隆 tag 快照即可。
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1   # v7.0.1
        with:
          fetch-depth: 1
          persist-credentials: false
      - name: 生成校验和与发布说明
        run: |
          set -euo pipefail
          sha256sum faxuanyun-legal-exam-assistant.user.js > faxuanyun-legal-exam-assistant.user.js.sha256
          # 先抽 CHANGELOG 正文并校验非空：缺章节/空章节时 notes 会只剩模板文字，不允许发布
          body="$(awk -v v="$GITHUB_REF_NAME" 'BEGIN{p=0} $0 ~ "^## "v"$" {p=1; next} p && /^## v/ {exit} p && /^---$/ {exit} p {print}' CHANGELOG.md)"
          if [ -z "$body" ]; then
            echo "::error::CHANGELOG.md 里没有 $GITHUB_REF_NAME 的非空章节正文；Release 已中止发布"
            exit 1
          fi
          {
            printf '## %s\n\n' "$GITHUB_REF_NAME"
            printf '%s\n' "$body"
            printf '\n## 安装 / 更新\n\n'
            printf -- '- 已安装旧版：油猴会按 `@updateURL` 自动检查更新，也可在油猴面板点「检查脚本更新」。\n'
            # 首装链接钉到本 tag 的 jsDelivr 版本：拿到的一定是本 Release 的脚本，
            # 不会受 main 分支后续提交或主版本别名镜像缓存影响。
            printf -- '- 首次安装：[安装脚本](https://fastly.jsdelivr.net/gh/%s@%s/faxuanyun-legal-exam-assistant.user.js)\n' "$GITHUB_REPOSITORY" "$GITHUB_REF_NAME"
            printf -- '- 附件含 `.user.js` 与本版同名 `.sha256` 校验文件。\n'
            size_bytes="$(wc -c < faxuanyun-legal-exam-assistant.user.js)"
            printf -- '- 脚本体积：%s KB（预算 512 KB）\n' "$(awk -v b="$size_bytes" 'BEGIN{printf "%.1f", b/1024}')"
            printf -- '- 校验和：`%s`\n' "$(cut -d' ' -f1 faxuanyun-legal-exam-assistant.user.js.sha256)"
          } > release-notes.md

      - name: 生成构建来源证明
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8  # v4.2.2
        with:
          subject-path: faxuanyun-legal-exam-assistant.user.js

      - name: 创建或更新 Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          if gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1; then
            gh release edit  "$GITHUB_REF_NAME" --title "$GITHUB_REF_NAME" --notes-file release-notes.md --draft=false
            gh release upload "$GITHUB_REF_NAME" --clobber \
              faxuanyun-legal-exam-assistant.user.js faxuanyun-legal-exam-assistant.user.js.sha256
          else
            gh release create "$GITHUB_REF_NAME" --title "$GITHUB_REF_NAME" --notes-file release-notes.md \
              faxuanyun-legal-exam-assistant.user.js faxuanyun-legal-exam-assistant.user.js.sha256
          fi

      # 发版门禁 3：发布后回读远端状态并复算校验和，防止「UI 看起来成功、附件其实不对」。
      # 失败时 Release 已经存在：未开启 immutable releases 可直接重跑本 workflow（附件 --clobber 覆盖）；
      # 开启 immutable releases 后附件不可覆盖，只能修说明或发新 patch。
      - name: 验证 Release（非草稿 / 2 个附件 / SHA256 一致）
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          fail() {
            echo "::error::$1；Release 已发布；未开启 immutable releases 时可重跑（附件会被覆盖），开启后只能发新 patch"
            exit 1
          }

          draft="$(gh release view "$TAG" --json isDraft --jq '.isDraft')"
          [ "$draft" = "false" ] || fail "Release $TAG 仍是草稿（isDraft=$draft）"

          count="$(gh release view "$TAG" --json assets --jq '.assets | length')"
          [ "$count" = "2" ] || fail "Release $TAG 的附件数是 $count，应为 2（.user.js 与 .sha256）"

          verify_dir="$RUNNER_TEMP/release-verify"
          rm -rf "$verify_dir" && mkdir -p "$verify_dir"
          gh release download "$TAG" --dir "$verify_dir" \
            --pattern '*.user.js' --pattern '*.sha256' || fail "从 Release 下载附件失败"

          ( cd "$verify_dir" && sha256sum -c faxuanyun-legal-exam-assistant.user.js.sha256 ) \
            || fail "下载回来的 .user.js 与远端 .sha256 记录不一致"

          cmp faxuanyun-legal-exam-assistant.user.js "$verify_dir/faxuanyun-legal-exam-assistant.user.js" \
            || fail "远端 .user.js 与本地构建文件内容不一致"

          local_sum="$(cut -d' ' -f1 faxuanyun-legal-exam-assistant.user.js.sha256)"
          remote_sum="$(cut -d' ' -f1 "$verify_dir/faxuanyun-legal-exam-assistant.user.js.sha256")"
          recomputed="$(sha256sum "$verify_dir/faxuanyun-legal-exam-assistant.user.js" | cut -d' ' -f1)"
          [ "$recomputed" = "$local_sum" ] || fail "附件复算 SHA256 与本地校验文件不一致（本地 $local_sum / 复算 $recomputed）"
          [ "$remote_sum" = "$recomputed" ] || fail "远端 .sha256 记录与附件复算值不一致（记录 $remote_sum / 复算 $recomputed）"

          echo "✓ Release $TAG 已发布：draft=false，附件 $count 个，SHA256 $recomputed 与远端一致"

      # 发版门禁 4：自动更新链路。用户点「检查更新」实际读的是 @updateURL 指向的
      # fastly.jsdelivr.net/gh/<repo>@<主版本>/... 文件（不是 main 分支），而 jsDelivr 对
      # 主版本别名也有边缘缓存；因此以 raw main（权威、无长缓存）作为「main 是否已跟上 tag」的判定，
      # 再尽量确认镜像也刷新了。latest Release 同样必须指向本 tag，
      # 否则新装用户拿到旧版、老用户永远被提示「已是最新」。
      # 顺序：先主动 purge jsDelivr 缓存 → 用 raw 判定并重试 → 镜像没刷新只记 warning，
      # 不把发版卡成红的。未开启 immutable releases 时可以重跑 workflow 再刷一次；
      # 开启后已发布附件不可覆盖，重跑会在更新 Release 时失败，只能等缓存自然过期或发新 patch。
      - name: 更新链校验（远端 @updateURL / latest tag）
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          fail() {
            echo "::error::$1"
            exit 1
          }

          FILE=faxuanyun-legal-exam-assistant.user.js
          script_url="$(sed -n 's/^\/\/ @updateURL[[:space:]]\{1,\}//p' "$FILE" | head -n1)"
          authoritative="https://raw.githubusercontent.com/${GITHUB_REPOSITORY}/main/${FILE}"
          read_version() {
            curl -fsSL --max-time 20 "$1" 2>/dev/null \
              | sed -n 's/^\/\/ @version[[:space:]]\{1,\}\([^[:space:]]\{1,\}\).*/\1/p' | head -n1
          }

          # 1) 主动清一次 jsDelivr 缓存（失败不影响发版结论，只是少一个加速手段）
          case "$script_url" in
            https://*jsdelivr.net/gh/*)
              # 边缘域名可能被换成 fastly / gcore / testingcf，这里按路径拼 purge 地址（purge 端点不分边缘）
              purge_path="${script_url#*jsdelivr.net}"
              purge_url="https://purge.jsdelivr.net${purge_path}"
              echo "purge 镜像缓存：$purge_url"
              curl -fsS --max-time 20 "$purge_url" >/dev/null 2>&1 || echo "::warning::purge jsDelivr 失败（不影响发版，镜像会自行过期刷新）"
              ;;
          esac

          # 2) 权威判定：raw 上的 main 必须已经是本 tag 的版本（raw 无长缓存，重试 6 次 × 20 秒）
          echo "检查权威地址：$authoritative"
          raw_version=""
          for i in 1 2 3 4 5 6; do
            raw_version="$(read_version "$authoritative")"
            [ "${raw_version#v}" = "${TAG#v}" ] && break
            echo "第 $i/6 次：raw 版本 ${raw_version:-空}，未到 $TAG，20 秒后重试…"
            sleep 20
          done
          [ "${raw_version#v}" = "${TAG#v}" ] || fail "main 上的 $FILE 版本是「${raw_version:-空}」，与 tag $TAG 不一致：先确认 main 已包含本版脚本再打 tag（发版流程要求先推 main）"
          echo "✓ main 上的脚本已是 $TAG"

          # 3) 镜像侧：尽量确认 @updateURL 也能取到本版；镜像缓存未刷新只警告（用户侧会自动过期）
          if [ -n "$script_url" ] && [ "$script_url" != "$authoritative" ]; then
            update_alias="$(printf '%s' "$script_url" | sed -n 's/.*@\([0-9][0-9]*\)\/.*/\1/p')"
            tag_major="${TAG#v}"
            tag_major="${tag_major%%.*}"
            if [ -n "$update_alias" ] && [ "$update_alias" -gt "$tag_major" ]; then
              echo "ℹ️ 升级桥：@$update_alias 镜像要等对应主版本发布后才存在，本版跳过镜像校验（bridge 正常行为）"
            else
              mirror_version="$(read_version "$script_url")"
              if [ "${mirror_version#v}" = "${TAG#v}" ]; then
                echo "✓ 镜像 @updateURL 已是 $TAG"
              else
                alias_label=""
                [ -n "$update_alias" ] && alias_label="@$update_alias "
                echo "::warning::镜像（$script_url）当前版本 ${mirror_version:-取不到}，尚未刷新到 $TAG；${alias_label}边缘缓存最长 12 小时（客户端另可能缓存更久），急着验证请用 @$TAG 固定链接或稍后重跑本 workflow（immutable releases 开启时不能覆盖附件，只能等缓存过期或发新 patch）"
              fi
            fi
          fi

          latest="$(gh release view --json tagName --jq '.tagName' 2>/dev/null || true)"
          [ "$latest" = "$TAG" ] || fail "latest Release 是「${latest:-无}」，不是 $TAG；Releases 页的 latest 下载入口会落后，请到 Release 页面把 $TAG 设为 latest"
          echo "✓ latest Release 指向 $TAG"

