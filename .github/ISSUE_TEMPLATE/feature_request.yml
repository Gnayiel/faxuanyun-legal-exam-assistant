name: 功能建议
description: 提出新能力、体验改进或文档/工程改进建议（不是脚本 bug）
title: "[Feature] "
labels: ["enhancement"]
body:
  - type: markdown
    attributes:
      value: |
        感谢建议。请先确认这不是「脚本行为不对」的 bug——那类问题请用 Bug 报告模板。
        功能建议不承诺实现；维护者会结合使用频率、维护成本和平台限制评估。
        **不要在 issue 里贴 API Key、考试账号、单位或其它个人信息。**
  - type: textarea
    id: problem
    attributes:
      label: 你想解决什么问题
      description: 描述当前的使用场景和痛点，不要只写「加个功能」
      placeholder: "例如：导入题库后，我想先预览会新增/覆盖哪些题，再决定是否落库。"
    validations:
      required: true
  - type: textarea
    id: solution
    attributes:
      label: 建议怎么做
      description: 你期望的交互、面板文案或数据流；不确定实现也可以写
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: 替代方案 / 已经试过的办法
      description: 现在你是怎么绕过的？有没有不改进脚本也能接受的方案？
  - type: dropdown
    id: area
    attributes:
      label: 涉及范围
      options:
        - 面板 / 交互
        - 答题 / 交卷流程
        - 题库 / 导入导出
        - AI / 百度查询
        - 文档 / 工程 / 测试
        - 其它
    validations:
      required: true
  - type: checkboxes
    id: confirm
    attributes:
      label: 确认
      options:
        - label: 我已搜索过现有 issue / Discussions，确认不是重复建议
          required: true
        - label: 我确认内容里没有 API Key / 个人隐私
          required: true
