<!DOCTYPE html>
<html lang="zh-CN">
<head><meta charset="utf-8"><title>学法考试（脱敏样例）· 跨页持久化</title></head>
<body>
<!--
  脱敏页面：单题判断题，用于「第一页答题写入题库 → 全新页面读同一份题库」的冒烟。
  第一页由打桩的百度接口作答；第二页由父进程把第一页的 questionBank 预置回 GM 存储，
  断言第二页只走精确命中、零联网、作答记录与选中态正确。不含任何真实身份信息。
-->
<header class="exam-header">
  <span class="exam-title">国家工作人员学法考试（脱敏样例）</span>
  <span class="exam-timer">剩余时间：04:59</span>
</header>

<div id="timucontent">
  <h2>1、判断题：行政机关作出行政处罚决定前，应当告知当事人拟作出的处罚内容。</h2>
  <div class="options">
    <label><input type="radio" name="option" value="A">正确</label>
    <label><input type="radio" name="option" value="B">错误</label>
  </div>
</div>

<div class="opbar">
  <a href="javascript:;" class="op-btn">上一题</a>
  <a href="javascript:;" id="btn-submit" class="op-btn">交卷</a>
</div>

<div class="exam-footer">
  题型分布：单选题：共 0 题 · 判断题：共 1 题
</div>

<script>
window.__picks = [];
window.__clicks = [];
document.getElementById('timucontent').addEventListener('click', function (e) {
  if (e.target && e.target.tagName === 'INPUT') {
    window.__picks.push({ value: e.target.value, checked: e.target.checked });
    window.__clicks.push(1);
  }
}, true);
document.getElementById('btn-submit').addEventListener('click', function (e) {
  e.preventDefault();
  window.__picks.push('submit');
});
</script>
</body>
</html>
