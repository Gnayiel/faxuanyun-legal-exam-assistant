name: 自检

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

# 只读仓库内容即可，不给 token 多余权限
permissions:
  contents: read

# 同一分支连续推送时取消旧的一次，省 runner 时间
concurrency:
  group: selftest-${{ github.ref }}
  cancel-in-progress: true

jobs:
  selftest:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      # 第三方 action 全部 pin 到 commit SHA（行尾注释是版本号）；
      # 升级由 .github/dependabot.yml 自动开 PR 完成。
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1   # v7.0.1
        with:
          # 版本单调 / 历史比较要读完整 tag 历史，浅克隆下会退化。
          fetch-depth: 0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1  # v7.1.0
        with:
          node-version: '22'

      # 元数据校验 + 脚本内置的 136 项断言，无第三方依赖
      - name: 内置自检
        run: node tools/selftest.mjs

      # 随仓库分发的题库快照与 README / data/README 里的数字必须一致
      - name: 数据与文档一致性
        run: node tools/check-data.mjs

      # 工作流配置静态检查：action 必须 pin SHA、权限最小化、脚本路径存在
      - name: 工作流静态检查
        run: node tools/check-workflows.mjs

      # 题库合并工具冒烟：同一份快照合并两次结果幂等
      - name: 题库合并工具冒烟
        run: |
          node tools/merge-bank.mjs data/faxuanyun-legal-exam-bank-*.json -o /tmp/merged.json --quiet
          node -e "const a=require('/tmp/merged.json');if(!a.count||a.count!==Object.keys(a.bank).length)process.exit(1);console.log('合并结果',a.count,'题')"

      # GitHub runner 自带 Edge / Chrome；--require-browser 让「找不到浏览器」直接失败，
      # 避免面板冒烟被静默跳过、CI 假绿。
      - name: 面板冒烟测试
        run: node tools/panel-smoke.mjs --require-browser

      # 页面适配冒烟：在 tests/fixtures/ 的脱敏考试页 / 成绩页上验证站点适配层
      # （题干、选项、题型、题数、按钮、作答选中态、成绩解析）。
      - name: 页面适配冒烟测试
        run: node tools/page-smoke.mjs --require-browser
