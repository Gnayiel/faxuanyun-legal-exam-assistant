name: 自检

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

# 只读仓库内容即可，不给 token 多余权限
permissions:
  contents: read

# 同一分支连续推送时取消旧的一次，省 runner 时间
concurrency:
  group: selftest-${{ github.ref }}
  cancel-in-progress: true

jobs:
  selftest:
    # Node 22 是 engines 下限，Node 24 是当前最新 LTS；两边都跑，避免只在某个版本可用的 API 溜进工具链。
    strategy:
      fail-fast: false
      matrix:
        node-version: ['22', '24']
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      # 第三方 action 全部 pin 到 commit SHA（行尾注释是版本号）；
      # 升级由 .github/dependabot.yml 自动开 PR 完成。
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1   # v7.0.1
        with:
          # 版本单调 / 历史比较要读完整 tag 历史，浅克隆下会退化。
          fetch-depth: 0
          # 这个 job 只读：不把 GITHUB_TOKEN 留在 .git/config 里，少一个被后续步骤拿去推代码的面
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1  # v7.1.0
        with:
          node-version: ${{ matrix.node-version }}

      # 统一门禁：语法检查、内置断言、数据/文档一致性、工作流检查、题库合并冒烟、
      # 面板冒烟与页面适配冒烟。与本地 `npm run ci`、release.yml 共用同一份步骤清单，
      # 不再手抄；--require-browser 让缺浏览器时直接失败而不是静默跳过。
      - name: 统一门禁（npm run ci）
        run: npm run ci
