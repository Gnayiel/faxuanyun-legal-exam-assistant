name: 发版

# 推送 vX.Y.Z tag 时自动发布 Release：先做 tag/版本/CHANGELOG 门禁与全套自检，
# 再建 Release、上传 .user.js 与同名 .sha256，最后下载远端附件复算校验和。
# `v*` tag 受 protect-release-tags 规则集保护（不能删除 / 改指向）：tag 打错请改用新版本号；
# 确实要重打 tag 时先临时停用该 ruleset。脚本用 --clobber 覆盖附件，验证失败修好后可直接重跑本 workflow。
on:
  push:
    tags: ['v*']

# 建 Release / 上传附件需要写权限；其余步骤用不到更多权限
permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      # 第三方 action 全部 pin 到 commit SHA，升级由 Dependabot 开 PR。
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1   # v7.0.1
        with:
          # 版本单调 / 历史比较要读完整 tag 历史，浅克隆下会退化。
          fetch-depth: 0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1  # v7.1.0
        with:
          node-version: '22'

      # 发版门禁 1：推送的 tag 必须正好等于脚本 // @version，且 CHANGELOG 有本版非空章节。
      # 不一致直接红，避免「v2.0.5 的 Release 里挂 2.0.4 的脚本」或空说明发布。
      - name: 校验 tag 与脚本版本 / CHANGELOG 章节
        env:
          TAG: ${{ github.ref_name }}
        run: node tools/release.mjs --check-ci "$TAG"

      # 发版门禁 2：语法、元数据、内置断言、数据/文档数字漂移、工作流配置、
      # 题库合并工具与两种浏览器冒烟（面板 UI + 站点页面适配）。
      # 放在生成校验和之前：自检不过就不该产出可发布的附件。
      - name: 发版前自检
        run: |
          node --check faxuanyun-legal-exam-assistant.user.js
          node tools/selftest.mjs
          node tools/check-data.mjs
          node tools/check-workflows.mjs
          node tools/merge-bank.mjs data/faxuanyun-legal-exam-bank-*.json -o /tmp/merged.json --quiet
          node -e "const a=require('/tmp/merged.json');if(!a.count||a.count!==Object.keys(a.bank).length)process.exit(1);console.log('合并结果',a.count,'题')"
          node tools/panel-smoke.mjs --require-browser
          node tools/page-smoke.mjs --require-browser

      - name: 生成校验和与发布说明
        run: |
          set -euo pipefail
          sha256sum faxuanyun-legal-exam-assistant.user.js > faxuanyun-legal-exam-assistant.user.js.sha256
          # 先抽 CHANGELOG 正文并校验非空：缺章节/空章节时 notes 会只剩模板文字，不允许发布
          body="$(awk -v v="$GITHUB_REF_NAME" 'BEGIN{p=0} $0 ~ "^## "v"$" {p=1; next} p && /^## v/ {exit} p && /^---$/ {exit} p {print}' CHANGELOG.md)"
          if [ -z "$body" ]; then
            echo "::error::CHANGELOG.md 里没有 $GITHUB_REF_NAME 的非空章节正文；Release 已中止发布"
            exit 1
          fi
          {
            printf '## %s\n\n' "$GITHUB_REF_NAME"
            printf '%s\n' "$body"
            printf '\n## 安装 / 更新\n\n'
            printf -- '- 已安装旧版：油猴会按 `@updateURL` 自动检查更新，也可在油猴面板点「检查脚本更新」。\n'
            printf -- '- 首次安装：[安装脚本](https://github.com/%s/raw/main/faxuanyun-legal-exam-assistant.user.js)\n' "$GITHUB_REPOSITORY"
            printf -- '- 附件含 `.user.js` 与本版同名 `.sha256` 校验文件。\n'
            size_bytes="$(wc -c < faxuanyun-legal-exam-assistant.user.js)"
            printf -- '- 脚本体积：%s KB（预算 512 KB）\n' "$(awk -v b="$size_bytes" 'BEGIN{printf "%.1f", b/1024}')"
            printf -- '- 校验和：`%s`\n' "$(cut -d' ' -f1 faxuanyun-legal-exam-assistant.user.js.sha256)"
          } > release-notes.md

      - name: 创建或更新 Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          if gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1; then
            gh release edit  "$GITHUB_REF_NAME" --title "$GITHUB_REF_NAME" --notes-file release-notes.md --draft=false
            gh release upload "$GITHUB_REF_NAME" --clobber \
              faxuanyun-legal-exam-assistant.user.js faxuanyun-legal-exam-assistant.user.js.sha256
          else
            gh release create "$GITHUB_REF_NAME" --title "$GITHUB_REF_NAME" --notes-file release-notes.md \
              faxuanyun-legal-exam-assistant.user.js faxuanyun-legal-exam-assistant.user.js.sha256
          fi

      # 发版门禁 3：发布后回读远端状态并复算校验和，防止「UI 看起来成功、附件其实不对」。
      # 失败时 Release 已经存在，修好后直接重跑本 workflow 即可（附件 --clobber 覆盖）。
      - name: 验证 Release（非草稿 / 2 个附件 / SHA256 一致）
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          fail() {
            echo "::error::$1；Release 已发布，修好后可重跑本 workflow（附件会被覆盖）"
            exit 1
          }

          draft="$(gh release view "$TAG" --json isDraft --jq '.isDraft')"
          [ "$draft" = "false" ] || fail "Release $TAG 仍是草稿（isDraft=$draft）"

          count="$(gh release view "$TAG" --json assets --jq '.assets | length')"
          [ "$count" = "2" ] || fail "Release $TAG 的附件数是 $count，应为 2（.user.js 与 .sha256）"

          verify_dir="$RUNNER_TEMP/release-verify"
          rm -rf "$verify_dir" && mkdir -p "$verify_dir"
          gh release download "$TAG" --dir "$verify_dir" \
            --pattern '*.user.js' --pattern '*.sha256' || fail "从 Release 下载附件失败"

          cmp faxuanyun-legal-exam-assistant.user.js "$verify_dir/faxuanyun-legal-exam-assistant.user.js" \
            || fail "远端 .user.js 与本地构建文件内容不一致"

          local_sum="$(cut -d' ' -f1 faxuanyun-legal-exam-assistant.user.js.sha256)"
          remote_sum="$(cut -d' ' -f1 "$verify_dir/faxuanyun-legal-exam-assistant.user.js.sha256")"
          recomputed="$(sha256sum "$verify_dir/faxuanyun-legal-exam-assistant.user.js" | cut -d' ' -f1)"
          [ "$recomputed" = "$local_sum" ] || fail "附件复算 SHA256 与本地校验文件不一致（本地 $local_sum / 复算 $recomputed）"
          [ "$remote_sum" = "$recomputed" ] || fail "远端 .sha256 记录与附件复算值不一致（记录 $remote_sum / 复算 $recomputed）"

          echo "✓ Release $TAG 已发布：draft=false，附件 $count 个，SHA256 $recomputed 与远端一致"

      # 发版门禁 4：自动更新链路。用户点「检查更新」读的是 main 分支上 @updateURL 指向的文件，
      # 所以远端脚本里的 // @version 必须已经是本 tag；latest Release 也必须指向本 tag，
      # 否则新装用户拿到旧版、老用户永远被提示「已是最新」。
      # GitHub raw 有 CDN 缓存，刚打 tag 时可能还是旧内容，因此重试 6 次 × 20 秒；
      # 仍不一致时先手动重跑本 workflow（多半是 CDN 延迟），重跑还红才是真问题。
      - name: 更新链校验（远端 @updateURL / latest tag）
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          fail() {
            echo "::error::$1"
            exit 1
          }

          script_url="$(sed -n 's/^\/\/ @updateURL[[:space:]]\{1,\}//p' faxuanyun-legal-exam-assistant.user.js | head -n1)"
          [ -n "$script_url" ] || script_url="https://raw.githubusercontent.com/${GITHUB_REPOSITORY}/main/faxuanyun-legal-exam-assistant.user.js"
          echo "检查远端脚本：$script_url"

          remote_version=""
          for i in 1 2 3 4 5 6; do
            body="$(curl -fsSL --max-time 20 "$script_url" 2>/dev/null || true)"
            remote_version="$(printf '%s\n' "$body" | sed -n 's/^\/\/ @version[[:space:]]\{1,\}\([^[:space:]]\{1,\}\).*/\1/p' | head -n1)"
            [ "${remote_version#v}" = "${TAG#v}" ] && break
            echo "第 $i/6 次：远端版本 ${remote_version:-空}，未到 $TAG，20 秒后重试…"
            sleep 20
          done
          [ "${remote_version#v}" = "${TAG#v}" ] || fail "远端 @updateURL 的 // @version 是「${remote_version:-空}」，与 tag $TAG 不一致。可能是 GitHub raw 的 CDN 还没刷新，稍后重跑本 workflow 即可；若重跑仍不一致，说明 main 上的脚本版本没跟上 tag"
          echo "✓ 远端 @updateURL 已是 $TAG"

          latest="$(gh release view --json tagName --jq '.tagName' 2>/dev/null || true)"
          [ "$latest" = "$TAG" ] || fail "latest Release 是「${latest:-无}」，不是 $TAG；Releases 页的 latest 下载入口会落后，请到 Release 页面把 $TAG 设为 latest"
          echo "✓ latest Release 指向 $TAG"

